<body>

        <span></span><span></span><span></span>
      </button>

  </nav>

  <main>

    <section class="page-hero">
      <div class="container">
        <a href="hobbies.html" class="back-link">&larr; Hobbies</a>
        <span class="hero-label">One Piece TCG</span>
        <h1 class="page-title">TCG Blog</h1>
        <p class="page-desc">Trips, tournaments, and card game updates.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="tcg-blog" id="tcg-all"></div>

    </section>

  </main>

  <footer id="contact">
    <div class="container">
      <div class="footer-top">
        <div class="footer-info">
          <span class="footer-name">Nikos Malakasis</span>
          <span class="footer-loc">Munich, Germany</span>

        <div class="footer-links">

    </div>
  </footer>

  <script src="script.js"></script>
  <script src="tcg-posts.js"></script>
  <script>
    (function () {
      var container = document.getElementById('tcg-all');
      var posts = window.TCG_POSTS || [];
      if (!posts.length) {
        container.innerHTML = '<p class="tcg-empty">No posts yet — check back soon.</p>';
        return;
      }
      container.innerHTML = posts.map(renderPost).join('');
    }());

    function renderPost(p) {
      var date = new Date(p.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      var photos = (p.photos || []).map(function (src) {
        return '<a href="' + src + '" target="_blank" rel="noopener"><img src="' + src + '" alt=""></a>';
      }).join('');
      return '<article class="tcg-post">'
        + '<time class="tcg-post-date">' + date + '</time>'
        + '<h3 class="tcg-post-title">' + p.title + '</h3>'
        + '<p class="tcg-post-body">' + p.body + '</p>'
        + (photos ? '<div class="tcg-post-photos">' + photos + '</div>' : '')
        + '</article>';
    }
  </script>
</body>
</html>
